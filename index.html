function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function makeExam(){
  current = shuffle(BANK).slice(0, 100);
  const box = document.getElementById('exam');
  box.innerHTML = '';
  current.forEach((q, idx) => {
    const no = idx + 1;
    const div = document.createElement('div');
    div.className = 'q';
    div.id = 'qbox' + no;
    div.dataset.answer = q.a;
    let html = `<div class="badge">${q.s}</div><h3>${no}. ${q.q}</h3>`;
    q.o.forEach((opt, i) => {
      html += `<label id="q${no}o${i+1}"><input type="radio" name="q${no}" value="${i+1}">${i+1}. ${opt}</label>`;
    });
    div.innerHTML = html;
    box.appendChild(div);
  });
  document.getElementById('result').style.display='none';
  window.scrollTo(0,0);
}

function gradeExam(){
  let score=0, unanswered=0;
  let subjects={"소프트웨어 설계":[0,0],"소프트웨어 개발":[0,0],"데이터베이스 구축":[0,0],"프로그래밍 언어 활용":[0,0],"정보시스템 구축관리":[0,0]};

  current.forEach((q, idx) => {
    const no = idx + 1;
    const ans = q.a;
    subjects[q.s][1]++;
    for(let j=1;j<=4;j++){
      const label=document.getElementById(`q${no}o${j}`);
      label.classList.remove('correct','wrong');
    }
    const checked=document.querySelector(`input[name="q${no}"]:checked`);
    if(!checked){
      unanswered++;
      document.getElementById(`q${no}o${ans}`).classList.add('correct');
      return;
    }
    const val=Number(checked.value);
    if(val===ans){
      score++;
      subjects[q.s][0]++;
      document.getElementById(`q${no}o${val}`).classList.add('correct');
    } else {
      document.getElementById(`q${no}o${val}`).classList.add('wrong');
      document.getElementById(`q${no}o${ans}`).classList.add('correct');
    }
  });

  let fail=false;
  let html=`<b>총점: ${score} / ${current.length}점</b><br>미응답: ${unanswered}문제<br><br>`;
  for(const [name, arr] of Object.entries(subjects)){
    if(arr[1]===0) continue;
    const rate = Math.round(arr[0]/arr[1]*100);
    const danger = rate < 40;
    if(danger) fail=true;
    html += `${name}: ${arr[0]}/${arr[1]}문제 (${rate}점 환산)${danger?' ⚠ 과락':''}<br>`;
  }
  html += `<br>판정: ${score>=60 && !fail ? '합격권' : '불합격/과락 위험'}`;
  const result=document.getElementById('result');
  result.innerHTML=html;
  result.style.display='block';
  window.scrollTo(0,0);
}

function resetExam(){
  document.querySelectorAll('input[type=radio]').forEach(i=>i.checked=false);
  document.querySelectorAll('label').forEach(l=>l.classList.remove('correct','wrong'));
  document.getElementById('result').style.display='none';
  window.scrollTo(0,0);
}

document.getElementById('newBtn').addEventListener('click', makeExam);
document.getElementById('gradeBtn').addEventListener('click', gradeExam);
document.getElementById('resetBtn').addEventListener('click', resetExam);
makeExam();
</script>
</body>
</html>
